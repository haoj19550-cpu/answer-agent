<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 闯关学习助手 · 原型 01 — MVP 核心闭环</title>
<style>
/* ============ 0. 基础与设计令牌 ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink-900:#101A2E; --ink-700:#2C3A52; --ink-500:#5A6A85; --ink-400:#8A97AC; --ink-300:#C3CBD9;
  --line:#E6EAF1; --paper:#FFFFFF; --bg:#F4F6F9; --bg-deep:#EDF1F6;
  --brand:#2B4EFF; --brand-press:#1E3AD1; --brand-soft:#EAEFFF;
  --mint:#00D3A7; --mint-press:#00B18D; --mint-soft:#E3FAF4;
  --amber:#FFB300; --amber-soft:#FFF5E0;
  --coral:#FF5C5C; --coral-press:#E24343; --coral-soft:#FFEDED;
  --gold:#FFD84D; --flame:#FF7A45; --tang:#FF8A3D;
  --boss-bg:#141B33; --boss-line:#2A3557;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:999px;
  --sh-card:0 1px 2px rgba(16,26,46,.04),0 6px 16px rgba(16,26,46,.05);
  --sh-boss:0 8px 24px rgba(20,27,51,.28);
  --font:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
  --z:1;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--ink-900);
  background:#E4E9F0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,figure,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:0}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.ic{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic14{width:14px;height:14px}.ic16{width:16px;height:16px}.ic18{width:18px;height:18px}.ic20{width:20px;height:20px}.ic32{width:32px;height:32px}

/* ============ 1. 画布：工具条 / 网格 / 图注 ============ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700}
.topbar .meta{font-size:12px;color:var(--ink-400);font-weight:500}
.topbar .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{height:32px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--paper);
  font-size:12px;font-weight:600;color:var(--ink-500);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.tbtn:hover{background:var(--bg)}
.tbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.wrap{max-width:1320px;margin:0 auto;padding:32px 32px 96px}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px;justify-items:center;zoom:var(--z)}
body.z75{--z:.75}
@media(max-width:1279px){.deck{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:899px){.deck{grid-template-columns:minmax(0,375px)}
  .wrap{padding:24px 16px 72px}.topbar{padding:12px 16px}}
.cell{width:375px;max-width:100%}
.capw{margin-top:14px;width:375px;max-width:100%}
.cap{display:block;font-size:14px;font-weight:700;color:var(--ink-900)}
.cap-sub{display:block;margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--ink-500)}
body.nocap .capw{display:none}
.sec{margin:56px 0 20px;padding-bottom:10px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec .no{font-size:12px;font-weight:700;color:var(--brand)}
.sec h2{font-size:20px;font-weight:700;line-height:1.4}
.sec p{font-size:13px;color:var(--ink-500);margin-left:auto;max-width:420px;text-align:right}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-card)}

/* ============ 2. 手机外壳 ============ */
.scr{position:relative;width:375px;height:812px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);border:10px solid #1A1F2E;border-radius:44px;box-shadow:0 12px 32px rgba(16,26,46,.16)}
.sb{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;
  font-size:14px;font-weight:600;color:var(--ink-900);background:var(--paper)}
.sb-r{display:flex;align-items:center;gap:5px}
.nb{flex:0 0 44px;position:relative;display:flex;align-items:center;padding:0 12px;background:var(--paper);
  border-bottom:1px solid var(--line)}
.nb-t{font-size:15px;font-weight:600;color:var(--ink-900)}
.nb-c{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.nb-b{width:32px;height:32px;display:grid;place-items:center;margin-left:-6px;color:var(--ink-900);position:relative;z-index:1}
.capsule{margin-left:auto;position:relative;z-index:1;width:87px;height:32px;flex:0 0 auto;border-radius:var(--r-full);
  background:rgba(255,255,255,.72);border:1px solid rgba(16,26,46,.09);display:flex;align-items:center;
  justify-content:space-evenly;color:var(--ink-700)}
.capsule i{width:1px;height:16px;background:rgba(16,26,46,.12)}
.nb.tr{background:transparent;border-bottom:0}
.bd{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:16px;scrollbar-width:none}
.bd::-webkit-scrollbar{width:0;height:0}
.bd.pad0{padding:0}
.act{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;background:var(--paper);border-top:1px solid var(--line)}
.tb{flex:0 0 56px;display:flex;background:var(--paper);border-top:1px solid var(--line)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:500;color:var(--ink-400)}
.tb button.on{color:var(--brand)}
.hi{flex:0 0 20px;display:grid;place-items:center;background:var(--paper)}
.hi i{width:134px;height:5px;border-radius:var(--r-full);background:var(--ink-900);opacity:.9}
.scr.dk{background:#0E1428}
.scr.dk .sb{background:transparent;color:#fff}
.scr.dk .nb-b{color:#fff}
.scr.dk .nb{background:transparent;border-bottom:0}
.scr.dk .capsule{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff}
.scr.dk .capsule i{background:rgba(255,255,255,.28)}
.scr.dk .act,.scr.dk .tb,.scr.dk .hi{background:#0E1428;border-color:var(--boss-line)}
.scr.dk .hi i{background:#fff}

/* ============ 3. 通用原子 ============ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh-card)}
.card+.card{margin-top:12px}
.card.dk{background:var(--boss-bg);border-color:var(--boss-line);box-shadow:var(--sh-boss);color:#fff}
.ct{font-size:17px;font-weight:700;line-height:1.45}
.cs{font-size:13px;color:var(--ink-500);line-height:1.5}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.row{display:flex;align-items:center;gap:8px}
.row.bt{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.txt-s{font-size:13px}.txt-xs{font-size:12px}.txt-mut{color:var(--ink-500)}.txt-faint{color:var(--ink-400)}
.txt-b{font-weight:700}.txt-m{font-weight:600}
.num{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:0}
.code{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--bg-deep);border-radius:var(--r-xs);
  padding:10px 12px;color:var(--ink-700);white-space:pre-wrap;word-break:break-all}
.scr.dk .code{background:#0A0F20;color:#B9C6E4}
.hl{background:linear-gradient(transparent 62%,var(--gold) 62%)}

.btn{height:48px;border-radius:var(--r-lg);font-size:16px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:8px;width:100%;transition:transform .09s ease,box-shadow .09s ease}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-press)}
.btn-p:active{transform:translateY(3px);box-shadow:0 0 0 var(--brand-press)}
.btn-s{background:var(--paper);color:var(--ink-900);border:1px solid var(--line);box-shadow:0 3px 0 var(--bg-deep)}
.btn-s:active{transform:translateY(3px);box-shadow:0 0 0 var(--bg-deep)}
.btn-m{background:var(--mint);color:#06302A;box-shadow:0 3px 0 var(--mint-press)}
.btn-m:active{transform:translateY(3px);box-shadow:0 0 0 var(--mint-press)}
.btn-g{background:var(--boss-bg);color:#fff;box-shadow:0 3px 0 #05080F}
.btn-g:active{transform:translateY(3px);box-shadow:0 0 0 #05080F}
.btn[disabled],.btn.dis{background:var(--bg-deep);color:var(--ink-300);box-shadow:none;cursor:not-allowed}
.btn-t{height:32px;width:auto;padding:0 6px;font-size:14px;font-weight:600;color:var(--brand);box-shadow:none}
.btn-sm{height:40px;font-size:14px;border-radius:var(--r-md)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 auto;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-700)}

.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;background:var(--bg-deep);color:var(--ink-500);white-space:nowrap}
.chip.br{background:var(--brand-soft);color:var(--brand)}
.chip.mt{background:var(--mint-soft);color:#00775F}
.chip.am{background:var(--amber-soft);color:#8A6100}
.chip.co{background:var(--coral-soft);color:#B32B2B}
.chip.gd{background:#FFF7D1;color:#7A6200}
.chip.dk{background:rgba(255,255,255,.12);color:#DCE4F7}
.chip.gh{background:var(--paper);border:1px solid var(--line);color:var(--ink-500)}
.chip.pick{background:var(--brand);color:#fff}
.badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#6A5300;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.bar{height:8px;border-radius:var(--r-full);background:var(--bg-deep);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--brand)}
.bar.mt i{background:var(--mint)}.bar.am i{background:var(--amber)}.bar.co i{background:var(--coral)}
.bar.lg{height:12px}
.nodes{display:flex;align-items:center;gap:0}
.nodes .nd{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--bg-deep);color:var(--ink-400)}
.nodes .nd.done{background:var(--mint);color:#06302A}
.nodes .nd.now{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.nodes .nd.miss{background:var(--coral);color:#fff}
.nodes .lk{flex:1 1 auto;height:3px;background:var(--bg-deep)}
.nodes .lk.done{background:var(--mint)}

.opt{display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--paper);
  border:1px solid var(--line);text-align:left;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink-300)}
.opt .k{width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:12px;
  font-weight:700;background:var(--bg-deep);color:var(--ink-500)}
.opt .tx{font-size:15px;line-height:1.5;color:var(--ink-900);padding-top:2px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 0 0 1px var(--mint)}
.opt.ok .k{background:var(--mint);color:#06302A}
.opt.bad{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 0 0 1px var(--coral)}
.opt.bad .k{background:var(--coral);color:#fff}
.opt.dim{opacity:.55}
.scr.dk .opt{background:rgba(255,255,255,.05);border-color:var(--boss-line)}
.scr.dk .opt .tx{color:#E6EBF8}
.scr.dk .opt .k{background:rgba(255,255,255,.1);color:#B9C6E4}
.scr.dk .opt.sel{border-color:#6E86FF;background:rgba(43,78,255,.22);box-shadow:0 0 0 1px #6E86FF}
.scr.dk .opt.sel .k{background:#6E86FF;color:#fff}

.field{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;width:100%;
  font-size:15px;color:var(--ink-900);text-align:left}
.field.ph{color:var(--ink-400)}
.field.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.field{min-height:120px;line-height:1.6;resize:none}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg-deep);border-radius:var(--r-full)}
.seg button{flex:1;height:32px;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--ink-500)}
.seg button.on{background:var(--paper);color:var(--brand);box-shadow:0 1px 3px rgba(16,26,46,.12)}
.seg.sq{border-radius:var(--r-md)}.seg.sq button{border-radius:var(--r-sm)}
.ck{width:20px;height:20px;flex:0 0 auto;border-radius:var(--r-xs);border:1.5px solid var(--ink-300);display:grid;place-items:center;background:var(--paper)}
.ck.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ck.rd{border-radius:50%}

.stamp{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:15px;font-weight:700}
.stamp.ok{background:var(--mint);color:#06302A}
.stamp.bad{background:var(--coral);color:#fff}
.stamp .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28)}
.stamp.ok .mk{background:rgba(255,255,255,.4)}

.quote{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink-700)}
.quote .src{display:block;margin-top:6px;font-size:11.5px;color:var(--brand);font-weight:600}

.ring{position:relative;width:132px;height:132px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--rc,var(--brand)) calc(var(--p,0)*1%),var(--bg-deep) 0)}
.ring i{position:absolute;inset:11px;border-radius:50%;background:var(--paper)}
.ring .rv{position:relative;z-index:1;text-align:center}
.ring .rv b{display:block;font-size:36px;line-height:1.1;font-weight:800}
.ring .rv span{display:block;font-size:11.5px;color:var(--ink-500);margin-top:2px}
.ring.sm{width:46px;height:46px}
.ring.sm i{inset:4px}
.ring.sm .rv b{font-size:12px;font-weight:700}
.ring.sm .rv span{display:none}
.scr.dk .ring i{background:var(--boss-bg)}

.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.list{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--paper)}

.tree{font-size:14px}
.tree li{position:relative;padding-left:18px}
.tree li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1.5px;background:var(--line)}
.tree li:last-child::before{bottom:auto;height:14px}
.tree li::after{content:"";position:absolute;left:5px;top:13px;width:9px;height:1.5px;background:var(--line)}
.tree>.tn{padding-left:0}
.tree>.tn::before,.tree>.tn::after{display:none}
.tn{display:flex;align-items:center;gap:8px;min-height:28px}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--ink-300)}
.tl li.now::before{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl li.done::before{border-color:var(--mint);background:var(--mint)}

.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-full);background:rgba(16,26,46,.88);
  color:#fff;font-size:13px;font-weight:500}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center}
.empty .art{width:96px;height:96px;border-radius:50%;background:var(--bg-deep);display:grid;place-items:center;color:var(--ink-300)}

.mscale{display:flex;height:8px;border-radius:var(--r-full);overflow:hidden;background:var(--bg-deep)}
.mscale i{display:block;height:100%}

/* ============ 4. 生成等待页 ============ */
.stage{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:22px}
.stage:last-child{padding-bottom:0}
.stage::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .ic-wrap{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--bg-deep);color:var(--ink-400);position:relative;z-index:1}
.stage.done .ic-wrap{background:var(--mint);color:#06302A}
.stage.now .ic-wrap{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.stage .st-t{font-size:14px;font-weight:600;color:var(--ink-400)}
.stage.done .st-t,.stage.now .st-t{color:var(--ink-900)}
.stage .st-s{font-size:12px;color:var(--ink-400);margin-top:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
.stage .st-done,.stage .spin{display:none}
.stage.done .st-ic{display:none}
.stage.done .st-done{display:block}
.stage.now .st-ic{display:none}
.stage.now .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<!-- ============ SVG 图标精灵（Lucide 风格，内联，无外部依赖） ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.6 12 3.2l9 7.4"/><path d="M5.4 9.4V20.8h13.2V9.4"/><path d="M9.6 20.8v-6.2h4.8v6.2"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.8h6a2.6 2.6 0 0 1 2 2.6v12a2.2 2.2 0 0 0-2-2H4z"/><path d="M20 4.8h-6a2.6 2.6 0 0 0-2 2.6v12a2.2 2.2 0 0 1 2-2h6z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M14.8 5.4 8.2 12l6.6 6.6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9.2 5.4 15.8 12l-6.6 6.6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M5.6 9.2 12 15.6l6.4-6.4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4.8 12.6 9.6 17.4 19.2 6.8"/></symbol>

    }
    paint();
    setInterval(function(){ i=(i+1)%(items.length+1); if(i===items.length){setTimeout(function(){i=0;paint()},900);return} paint(); },1600);
  });
})();
</script>
